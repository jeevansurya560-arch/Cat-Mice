<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460">
  <defs>
    <!-- Cinematic Character Radial Backlight -->
    <radialGradient id="charAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4b505d" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#4b505d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Progress Bar Glow -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4b505d"/>
      <stop offset="50%" stop-color="#656a78"/>
      <stop offset="100%" stop-color="#b1b9c7"/>
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title-text { font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .dex-text { font-size: 13px; font-weight: 700; fill: #8b949e; letter-spacing: 1px; }
    .stat-label { font-size: 11px; font-weight: 600; fill: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val { font-size: 14px; font-weight: 800; fill: #f0f6fc; }
  </style>

  <rect width="520" height="460" fill="#0d1117" rx="14"/>

  <!-- Subtle Radial Glow Behind Character -->
  <ellipse cx="260" cy="230" rx="190" ry="170" fill="url(#charAura)"/>

  <!-- Minimal Anime Ground Platform -->
  <ellipse cx="260" cy="390" rx="140" ry="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <ellipse cx="260" cy="389" rx="100" ry="10" fill="#21262d" opacity="0.6"/>

  <!-- Floating Embers Layer -->
  <g id="embers">
    
  </g>

  <!-- Render 2.5D Anime Character -->
  
    <g id="charmeleon" class="pokemon-2d-anime" transform="translate(0, 0)">
      <!-- Tail & Flame (Region: tail_flame) -->
      <g id="region-tail">
        <path d="M 170 270 C 120 280 80 255 60 210 C 48 185 55 160 68 140 C 76 155 88 185 118 215 C 140 235 165 248 185 252 Z"
              fill="#3e424c" stroke="#1a1c22" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M 172 265 C 125 275 88 250 70 210 C 58 188 65 168 74 150 C 82 165 95 192 122 220 C 145 238 168 250 185 254 Z"
              fill="#656a78"/>
      </g>

      <!-- Fierce Tail Flame -->
      <g id="region-tail_flame" transform="translate(0, 6)">
        <path d="M 68 145 C 35 125 15 75 45 40 C 65 70 70 90 90 75 C 110 60 105 30 125 15 C 135 55 130 95 110 120 C 95 138 82 145 68 145 Z"
              fill="#4b505d" filter="drop-shadow(0 0 10px #4b505d)"/>
        <path d="M 68 140 C 45 120 30 85 52 55 C 68 78 74 92 92 82 C 105 72 102 48 116 38 C 125 68 118 95 102 118 Z"
              fill="#656a78"/>
        <path d="M 70 135 C 55 115 45 92 60 70 C 72 88 78 95 90 88 C 102 80 100 62 108 52 C 115 75 108 95 96 114 Z"
              fill="#b1b9c7"/>
      </g>

      <!-- Strong Legs & Stance (Region: legs) -->
      <g id="region-legs-left">
        <ellipse cx="150" cy="310" rx="32" ry="24" fill="#3e424c" stroke="#1a1c22" stroke-width="4.5"/>
        <path d="M 125 328 L 120 336 L 130 330 M 135 330 L 132 340 L 142 332 M 147 330 L 146 339 L 155 331"
              stroke="#1a1c22" stroke-width="3" fill="#ffffff"/>
      </g>

      <!-- Torso & Muscular Chest (Region: torso) -->
      <g id="region-torso">
        <path d="M 160 190 C 150 245 160 305 205 320 C 260 325 285 280 275 210 C 270 175 230 170 190 178 Z"
              fill="#3e424c" stroke="#1a1c22" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M 166 188 C 158 240 168 298 210 314 C 255 318 278 276 268 212 C 264 180 228 174 190 180 Z"
              fill="#656a78"/>
        <!-- Golden Cream Belly -->
        <path d="M 190 185 C 178 230 185 285 215 310 C 248 310 262 275 256 225 C 250 190 220 180 190 185 Z"
              fill="#a0a8b8"/>
      </g>

      <!-- Right Leg (Region: legs) -->
      <g id="region-legs-right">
        <ellipse cx="245" cy="310" rx="34" ry="26" fill="#656a78" stroke="#1a1c22" stroke-width="4.5"/>
        <ellipse cx="245" cy="306" rx="28" ry="18" fill="#8c93a4" opacity="0.35"/>
        <!-- Razor Claws -->
        <path d="M 230 328 L 226 338 L 236 331 M 242 330 L 242 342 L 250 332 M 256 328 L 258 338 L 265 330"
              stroke="#1a1c22" stroke-width="3.5" fill="#ffffff"/>
      </g>

      <!-- Arms & Predatory Claws (Region: arms & claws_details) -->
      <g id="region-arms">
        <!-- Right Forearm -->
        <path d="M 245 210 C 275 218 295 235 288 255 C 280 268 262 260 245 242 Z"
              fill="#656a78" stroke="#1a1c22" stroke-width="4.5"/>
        <!-- Triple White Claws -->
        <path d="M 285 248 L 298 250 L 288 256 M 283 255 L 294 262 L 282 264 M 276 260 L 285 270 L 274 268"
              stroke="#1a1c22" stroke-width="3" fill="#ffffff"/>
      </g>

      <!-- Head with Prominent Horn Crest (Region: head) -->
      <g id="region-head">
        <!-- Head Profile & Rear Horn -->
        <path d="M 160 120 C 130 90 115 80 100 85 C 120 105 145 118 160 125 C 160 85 205 60 250 70 C 295 80 315 125 300 160 C 285 190 230 195 190 180 C 170 168 160 145 160 120 Z"
              fill="#3e424c" stroke="#1a1c22" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M 164 118 C 136 92 122 84 108 88 C 126 106 148 118 164 124 C 164 88 206 65 248 74 C 290 84 308 124 294 156 C 280 184 228 190 190 176 C 172 164 164 142 164 118 Z"
              fill="#656a78"/>
        <!-- Horn Highlight -->
        <path d="M 112 90 C 130 105 150 115 170 120"
              stroke="#8c93a4" stroke-width="4" stroke-linecap="round" fill="none"/>

        <!-- Piercing Green Eye -->
        <g id="region-eye">
          <polygon points="235,110 265,115 255,135 230,128" fill="#ffffff" stroke="#1a1c22" stroke-width="3"/>
          <polygon points="240,113 260,117 252,132 235,126" fill="#3d444c"/>
          <ellipse cx="248" cy="122" rx="3.5" ry="7" fill="#0b1710"/>
          <circle cx="245" cy="116" r="2.5" fill="#ffffff"/>
        </g>

        <!-- Fierce Snout & Grin -->
        <ellipse cx="285" cy="138" rx="2.5" ry="3.5" fill="#1a1c22"/>
        <path d="M 230 152 Q 260 162 288 142" stroke="#1a1c22" stroke-width="4" fill="none" stroke-linecap="round"/>
        <polygon points="270,148 274,158 278,150" fill="#ffffff" stroke="#1a1c22" stroke-width="1.5"/>
      </g>
    </g>
  

  <!-- Modern HUD Header -->
  <g class="font-hud" transform="translate(36, 36)">
    <!-- Dex & Name -->
    <text x="0" y="0" class="dex-text">No. 0005<tspan dx="8" font-size="11" font-weight="700" fill="#ffa059">● FIRE</tspan></text>
    <text x="0" y="22" class="title-text">CHARMELEON</text>

    <!-- Contribution & Stage Progress Metric -->
    <text x="448" y="0" text-anchor="end" class="stat-label">Lifetime Activity</text>
    <text x="448" y="20" text-anchor="end" class="stat-val">219 Commits</text>
  </g>

  <!-- Progress Bar Footer -->
  <g class="font-hud" transform="translate(40, 412)">
    <!-- Background Track -->
    <rect x="0" y="0" width="440" height="8" rx="4" fill="#21262d"/>
    <!-- Animated Color Fill -->
    <rect x="0" y="0" width="21" height="8" rx="4" fill="url(#progressGrad)"/>
    <!-- Stats Row -->
    <text x="0" y="24" class="stat-label">Stage Colouring Progress</text>
    <text x="440" y="24" text-anchor="end" class="stat-val">4.7%</text>
  </g>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460">
  <defs>
    <!-- Cinematic Character Radial Backlight -->
    <radialGradient id="charAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a00" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ff2a00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Progress Bar Glow -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a00"/>
      <stop offset="50%" stop-color="#ff6e1a"/>
      <stop offset="100%" stop-color="#fffb99"/>
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title-text { font-size: 20px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .dex-text { font-size: 13px; font-weight: 700; fill: #8b949e; letter-spacing: 1px; }
    .stat-label { font-size: 11px; font-weight: 600; fill: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val { font-size: 14px; font-weight: 800; fill: #f0f6fc; }
  </style>

  <rect width="520" height="460" fill="#0d1117" rx="14"/>

  <!-- Subtle Radial Glow Behind Character -->
  <ellipse cx="260" cy="230" rx="190" ry="170" fill="url(#charAura)"/>

  <!-- Minimal Anime Ground Platform -->
  <ellipse cx="260" cy="390" rx="140" ry="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <ellipse cx="260" cy="389" rx="100" ry="10" fill="#21262d" opacity="0.6"/>

  <!-- Floating Embers Layer -->
  <g id="embers">
    
  </g>

  <!-- Render 2.5D Anime Character -->
  
    <g id="charizard" class="pokemon-2d-anime front-facing" transform="translate(0, 0)">
      <!-- MASSIVE DRAGON WINGS (BALANCED SYMMETRICAL EXPANSION ON BOTH SIDES) -->
      <g id="region-wings">
        <!-- LEFT WING (Expansive Teal Membrane & Bone) -->
        <g id="wing-left" transform="rotate(0, 210, 180)">
          <!-- Outer Wing Bone & Thumb Claw -->
          <path d="M 210 180 C 150 90 70 80 35 105 C 25 150 65 230 170 245 Z"
                fill="#c44a07" stroke="#2a150c" stroke-width="5" stroke-linejoin="round"/>
          <!-- Teal Inner Membrane -->
          <path d="M 200 185 C 145 105 78 95 44 115 C 38 152 75 220 168 238 C 150 215 160 195 200 185 Z"
                fill="#18a49c"/>
          <!-- Wing Finger Ridge Ribs -->
          <path d="M 115 130 C 105 170 110 205 115 225 M 70 120 C 65 155 70 190 75 210"
                stroke="#0f6661" stroke-width="4" stroke-linecap="round" fill="none"/>
          <!-- Left Thumb Claw -->
          <polygon points="38,98 22,102 34,112" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
        </g>

        <!-- RIGHT WING (Expansive Teal Membrane & Bone) -->
        <g id="wing-right" transform="rotate(0, 310, 180)">
          <!-- Outer Wing Bone & Thumb Claw -->
          <path d="M 310 180 C 370 90 450 80 485 105 C 495 150 455 230 350 245 Z"
                fill="#ff6e1a" stroke="#2a150c" stroke-width="5" stroke-linejoin="round"/>
          <!-- Teal Inner Membrane -->
          <path d="M 320 185 C 375 105 442 95 476 115 C 482 152 445 220 352 238 C 370 215 360 195 320 185 Z"
                fill="#18a49c"/>
          <!-- Wing Finger Ridge Ribs -->
          <path d="M 405 130 C 415 170 410 205 405 225 M 450 120 C 455 155 450 190 445 210"
                stroke="#0f6661" stroke-width="4" stroke-linecap="round" fill="none"/>
          <!-- Right Thumb Claw -->
          <polygon points="482,98 498,102 486,112" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
        </g>
      </g>

      <!-- Tail with Blazing Inferno (Region: tail & tail_flame) -->
      <g id="region-tail">
        <path d="M 285 330 C 350 340 410 310 430 250 C 445 205 430 160 410 130 C 400 155 395 195 375 230 C 350 268 310 295 275 310 Z"
              fill="#c44a07" stroke="#2a150c" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M 284 324 C 345 334 402 305 422 248 C 435 208 422 168 406 138 C 396 162 390 198 372 232 C 348 268 310 294 276 308 Z"
              fill="#ff6e1a"/>
      </g>

      <!-- Roaring Tail Fire -->
      <g id="region-tail_flame" transform="translate(0, 8)">
        <path d="M 410 135 C 375 105 350 45 390 5 C 415 45 425 65 450 50 C 475 35 470 0 495 -20 C 510 30 505 80 480 110 C 460 130 438 140 410 135 Z"
              fill="#ff2a00" filter="drop-shadow(0 0 16px #ff2a00)"/>
        <path d="M 410 130 C 380 102 360 55 395 20 C 415 52 424 70 446 58 C 465 45 460 18 480 5 C 492 40 486 78 465 105 Z"
              fill="#ff6e1a"/>
        <path d="M 412 122 C 390 98 375 68 402 35 C 420 62 428 74 444 65 C 458 54 455 34 466 22 C 475 50 468 80 452 100 Z"
              fill="#fffb99"/>
      </g>

      <!-- Massive Dragon Left Leg & Talons (Region: legs) -->
      <g id="region-legs-left">
        <ellipse cx="185" cy="355" rx="42" ry="32" fill="#c44a07" stroke="#2a150c" stroke-width="5"/>
        <ellipse cx="185" cy="350" rx="34" ry="24" fill="#ff6e1a"/>
        <!-- 3 Talons -->
        <polygon points="152,376 142,392 160,382" fill="#ffffff" stroke="#2a150c" stroke-width="2.5"/>
        <polygon points="172,378 168,396 182,384" fill="#ffffff" stroke="#2a150c" stroke-width="2.5"/>
        <polygon points="196,376 198,394 206,380" fill="#ffffff" stroke="#2a150c" stroke-width="2.5"/>
      </g>

      <!-- Massive Dragon Right Leg & Talons (Region: legs) -->
      <g id="region-legs-right">
        <ellipse cx="335" cy="355" rx="42" ry="32" fill="#c44a07" stroke="#2a150c" stroke-width="5"/>
        <ellipse cx="335" cy="350" rx="34" ry="24" fill="#ff6e1a"/>
        <!-- 3 Talons -->
        <polygon points="314,376 316,394 324,380" fill="#ffffff" stroke="#2a150c" stroke-width="2.5"/>
        <polygon points="338,378 352,396 348,384" fill="#ffffff" stroke="#2a150c" stroke-width="2.5"/>
        <polygon points="358,376 378,392 368,382" fill="#ffffff" stroke="#2a150c" stroke-width="2.5"/>
      </g>

      <!-- Broad Dragon Torso & Segmented Belly (Region: torso) -->
      <g id="region-torso">
        <!-- Main Dragon Torso -->
        <path d="M 185 220 C 170 280 185 350 225 370 C 260 378 295 370 335 350 C 350 280 335 220 295 200 C 260 195 220 200 185 220 Z"
              fill="#c44a07" stroke="#2a150c" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M 190 218 C 176 275 190 345 228 365 C 260 372 292 365 330 345 C 344 275 330 218 292 200 C 260 195 222 200 190 218 Z"
              fill="#ff6e1a"/>
        <!-- Cream Segmented Belly Plates (Down Center) -->
        <path d="M 220 205 C 205 255 210 330 235 355 C 260 360 285 355 305 330 C 315 255 310 205 260 202 Z"
              fill="#ffe082"/>
        <!-- Segment Ridges -->
        <path d="M 222 245 Q 260 258 298 245 M 224 285 Q 260 298 296 285 M 228 322 Q 260 335 292 322"
              stroke="#d1b66b" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Muscular Arms & Claws (Region: arms) -->
      <g id="region-arms-left">
        <path d="M 195 225 C 160 235 145 260 152 280 C 160 290 180 285 195 265 Z"
              fill="#c44a07" stroke="#2a150c" stroke-width="5"/>
        <path d="M 194 225 C 164 235 150 258 156 276 C 162 284 176 280 190 262 Z"
              fill="#ff6e1a"/>
        <!-- Claws -->
        <polygon points="146,274 132,280 144,286" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
        <polygon points="148,282 136,292 150,290" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
      </g>

      <g id="region-arms-right">
        <path d="M 325 225 C 360 235 375 260 368 280 C 360 290 340 285 325 265 Z"
              fill="#c44a07" stroke="#2a150c" stroke-width="5"/>
        <path d="M 326 225 C 356 235 370 258 364 276 C 358 284 344 280 330 262 Z"
              fill="#ff6e1a"/>
        <!-- Claws -->
        <polygon points="374,274 388,280 376,286" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
        <polygon points="372,282 384,292 370,290" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
      </g>

      <!-- Head with TWIN DRAGON HORNS (Region: head) - FRONT-FACING -->
      <g id="region-head">
        <!-- Neck -->
        <path d="M 235 195 C 238 160 248 145 260 135 C 272 145 282 160 285 195 Z"
              fill="#ff6e1a" stroke="#2a150c" stroke-width="5"/>

        <!-- LEFT HORN (Curving back and left) -->
        <path d="M 236 115 C 205 75 165 60 145 68 C 175 88 215 105 236 115 Z"
              fill="#c44a07" stroke="#2a150c" stroke-width="4.5"/>
        <path d="M 238 112 C 210 75 174 64 152 70 C 180 88 216 104 238 112 Z"
              fill="#ff6e1a"/>
        <path d="M 154 72 C 182 90 216 105 236 114" stroke="#ffa359" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- RIGHT HORN (Curving back and right) -->
        <path d="M 284 115 C 315 75 355 60 375 68 C 345 88 305 105 284 115 Z"
              fill="#c44a07" stroke="#2a150c" stroke-width="4.5"/>
        <path d="M 282 112 C 310 75 346 64 368 70 C 340 88 304 104 282 112 Z"
              fill="#ff6e1a"/>
        <path d="M 366 72 C 338 90 304 105 284 114" stroke="#ffa359" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- Dragon Head Base & Jaws -->
        <path d="M 195 140 C 185 88 225 65 260 65 C 295 65 335 88 325 140 C 315 185 280 200 260 200 C 240 200 205 185 195 140 Z"
              fill="#c44a07" stroke="#2a150c" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 198 138 C 188 92 226 70 260 70 C 294 70 332 92 322 138 C 312 180 278 195 260 195 C 242 195 208 180 198 138 Z"
              fill="#ff6e1a"/>

        <!-- Forehead Crest Contour -->
        <path d="M 228 88 C 248 80 272 80 292 88" stroke="#ffa359" stroke-width="4.5" stroke-linecap="round" fill="none"/>

        <!-- Snout Center & Dual Nostrils -->
        <ellipse cx="260" cy="155" rx="14" ry="8" fill="#ffa359" opacity="0.35"/>
        <circle cx="253" cy="155" r="2.8" fill="#2a150c"/>
        <circle cx="267" cy="155" r="2.8" fill="#2a150c"/>

        <!-- LEFT CYAN DRAGON EYE (Clearly Visible) -->
        <g id="region-eye-left">
          <polygon points="215,124 246,118 240,140 213,136" fill="#ffffff" stroke="#2a150c" stroke-width="3"/>
          <polygon points="219,125 242,120 237,137 217,134" fill="#00c4ef"/>
          <polygon points="223,126 235,123 232,136 222,134" fill="#002830"/>
          <circle cx="224" cy="125" r="2.5" fill="#ffffff"/>
        </g>

        <!-- RIGHT CYAN DRAGON EYE (Clearly Visible) -->
        <g id="region-eye-right">
          <polygon points="305,124 274,118 280,140 307,136" fill="#ffffff" stroke="#2a150c" stroke-width="3"/>
          <polygon points="301,125 278,120 283,137 303,134" fill="#00c4ef"/>
          <polygon points="297,126 285,123 288,136 298,134" fill="#002830"/>
          <circle cx="296" cy="125" r="2.5" fill="#ffffff"/>
        </g>

        <!-- Dragon Jaws with Sharp Dual Fangs -->
        <path d="M 230 170 Q 260 184 290 170" stroke="#2a150c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <!-- Upper Fangs -->
        <polygon points="242,171 247,185 252,172" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
        <polygon points="268,172 273,185 278,171" fill="#ffffff" stroke="#2a150c" stroke-width="2"/>
        <!-- Lower Teeth -->
        <polygon points="256,181 260,172 264,181" fill="#ffffff" stroke="#2a150c" stroke-width="1.5"/>
      </g>
    </g>
  

  <!-- Modern HUD Header -->
  <g class="font-hud" transform="translate(36, 36)">
    <!-- Dex & Name -->
    <text x="0" y="0" class="dex-text">No. 0006<tspan dx="8" font-size="11" font-weight="700" fill="#ffa059">● FIRE</tspan><tspan dx="8" font-size="11" font-weight="700" fill="#ffa059">● FLYING</tspan></text>
    <text x="0" y="22" class="title-text">CHARIZARD</text>

    <!-- Contribution & Stage Progress Metric -->
    <text x="448" y="0" text-anchor="end" class="stat-label">Lifetime Activity</text>
    <text x="448" y="20" text-anchor="end" class="stat-val">750 Commits</text>
  </g>

  <!-- Progress Bar Footer -->
  <g class="font-hud" transform="translate(40, 412)">
    <!-- Background Track -->
    <rect x="0" y="0" width="440" height="8" rx="4" fill="#21262d"/>
    <!-- Animated Color Fill -->
    <rect x="0" y="0" width="209" height="8" rx="4" fill="url(#progressGrad)"/>
    <!-- Stats Row -->
    <text x="0" y="24" class="stat-label">Stage Colouring Progress</text>
    <text x="440" y="24" text-anchor="end" class="stat-val">47.5%</text>
  </g>
</svg>
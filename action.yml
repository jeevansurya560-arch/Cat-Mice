name: "CAT-MICE Ecosystem Generator"
description: "Generates an animated pixel-art Cat & Mouse ecosystem looping GIF and SVG driven by your GitHub developer activity."
author: "jeevansurya560-arch"
branding:
  icon: "heart"
  color: "orange"

inputs:
  user:
    description: "GitHub username to generate ecosystem for"
    required: false
    default: "${{ github.repository_owner }}"
  theme:
    description: "Language color theme override (e.g. javascript, python, rust, cpp, java, auto)"
    required: false
    default: "auto"
  token:
    description: "GitHub token for API queries"
    required: false
    default: "${{ github.token }}"
  out:
    description: "Output directory for generated artifacts"
    required: false
    default: "dist"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@12.18.0

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    - name: Generate CAT-MICE Artifacts
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        node src/cli.js --mode=production --user="${{ inputs.user }}" --theme="${{ inputs.theme }}" --out="${{ github.workspace }}/${{ inputs.out }}" --details

name: "GitHub Pokémon Evolution Companion"
description: "Interactive GitHub contribution-powered Pokémon evolution companion in 2.5D modern anime aesthetic."
author: "jeevansurya560-arch"
branding:
  icon: "zap"
  color: "orange"

inputs:
  user:
    description: "GitHub username to generate evolution companion for"
    required: false
    default: "${{ github.repository_owner }}"
  token:
    description: "GitHub token for API queries"
    required: false
    default: "${{ github.token }}"
  out:
    description: "Output directory for generated GIF and SVG artifacts"
    required: false
    default: "assets/generated"
  readme:
    description: "Path to README.md to update with live managed markers"
    required: false
    default: "README.md"
  social:
    description: "Whether to generate LinkedIn preview, showcase, and post draft"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@12.18.0

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    - name: Generate Pokémon Evolution Companion
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        node src/cli.js --mode=production --user="${{ inputs.user }}" --out="${{ github.workspace }}/${{ inputs.out }}" --readme="${{ github.workspace }}/${{ inputs.readme }}" --social --details
